name: Publish signed repository

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: signed-plugin-pages
  cancel-in-progress: false

jobs:
  # Referencing an environment creates it before the first step runs.
  preflight:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require configured identity before entering the signing environment
        run: python3 tools/guard.py --root . --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF"
      - name: Require existing master-only deployment protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_environment.py --repository "$GITHUB_REPOSITORY"

  # Unprivileged: no environment, secrets, Pages write or OIDC. Only VitePress runs here.
  docs-build:
    needs: [preflight]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install locked documentation tools
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and check documentation
        run: bun run check:docs
      - name: Check configured documentation template
        run: python3 tools/tests/check_docs_template.py --root .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: build/docs
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  publish:
    needs: [preflight, docs-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install locked authoring compiler
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require configured repository, master and public fingerprint
        run: python3 tools/guard.py --root . --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF"
      - name: Run all checks without the official key
        run: tools/check.sh
      - name: Restore the signing key outside the checkout
        env:
          INTERCEPTOR_REPOSITORY_KEY_B64: ${{ secrets.INTERCEPTOR_REPOSITORY_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('INTERCEPTOR_REPOSITORY_KEY_B64', '')
          if not value:
              raise SystemExit('Signing environment Secret is missing; unsigned fallback is forbidden')
          raw = base64.b64decode(value, validate=True)
          if len(raw) != 32:
              raise SystemExit('Signing Secret must encode a raw 32-byte key')
          path = Path(os.environ['RUNNER_TEMP']) / 'interceptor-plugin-repository.key'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as file:
              file.write(raw)
          PY
      - name: Verify previous metadata and sign the new feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export INTERCEPTOR_SIGNING_KEY_PATH="$RUNNER_TEMP/interceptor-plugin-repository.key"
          tools/publish.sh
      - name: Download the documentation built by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: build/docs
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Compose signed feed and documentation into one Pages tree
        run: python3 tools/compose_pages.py --feed build/site --docs build/docs --output build/pages
      - name: Verify the combined signed feed
        run: |
          verifier="$PWD/tools/repository-tool"
          "$verifier" verify-local "$PWD" build/pages --signed
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
      - name: Refuse stale master before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
      - name: Deploy generated feed and packages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Read back exact sequence, signature, expiry and package hashes
        run: |
          verifier="$PWD/tools/repository-tool"
          sequence="$(cat build/sequence.txt)"
          for attempt in 1 2 3 4 5 6; do
            if "$verifier" verify-live "$PWD" "$sequence"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
      - name: Delete only this job's restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/interceptor-plugin-repository.key"
