name: Validate samples

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '["AGENTS.md","CLAUDE.md","LICENSE","README.md","docs/development/ci-change-scope.md","docs/maintaining.md","docs/superpowers/plans/2026-10-17-official-plugin-repository.md","docs/superpowers/specs/2026-10-17-official-plugin-repository-design.md"]'
      doc-prefixes: '[]'
      runner: '"ubuntu-latest"'

  validate:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"xcode-27"') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          bun-version-file: .bun-version
      - name: Install locked authoring compiler
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test packages, real QuickJS outputs and integrity failures
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: tools/check.sh

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"

  # Always runs and never uses the documentation-only exemption: read-only Linux, no secrets or deployment.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install locked documentation tools
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test documentation pipeline helpers
        run: python3 -m unittest discover -s tests -p 'test_docs_*.py' -v
      - name: Build and check documentation
        run: bun run check:docs
      - name: Check configured documentation template
        run: python3 tools/tests/check_docs_template.py --root .
